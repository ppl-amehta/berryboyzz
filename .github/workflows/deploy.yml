name: Frontier CI/CD Quality Gate & Continuous Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_bm3YcarbVS0iXhALfg9ysiZi' }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_47ijuZlhC4AwCG1rfUbxiYwPJwsK' }}

jobs:
  quality-gate:
    name: TypeCheck, Tests & Verification Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js 24/26 Environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies Deterministically
        run: npm ci

      - name: Strict TypeScript & Type Manifest Verification
        run: npm run check

      - name: Execute Vitest Automated Test Matrix
        run: npm test

      - name: Verify Local Production Build
        run: npm run build

  deploy-preview:
    name: Vercel Ephemeral Preview Deployment
    needs: quality-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js 24/26 Environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Pull Vercel Environment (Preview)
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts (Preview)
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Prebuilt Artifacts to Vercel
        id: deploy
        run: |
          PREVIEW_URL=$(npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "### 🚀 Vercel Ephemeral Preview Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Preview URL:** [$PREVIEW_URL]($PREVIEW_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.head_ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** \`bom1 (Mumbai)\`" >> $GITHUB_STEP_SUMMARY

      - name: Comment Preview Link on Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            if (url) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `### 🍓 Berryboyzz™ Frontier Preview Deployed\n\n- **Preview URL:** [${url}](${url})\n- **Commit:** \`${context.sha.substring(0, 7)}\`\n- **Status:** ✅ Passed Quality Gate & Built with Rolldown\n- **Edge Region:** \`bom1\` (Mumbai, India)`
              });
            }

  deploy-production:
    name: Vercel Production Release (main)
    needs: quality-gate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js 24/26 Environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Pull Vercel Environment (Production)
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts (Production)
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Prebuilt Artifacts to Vercel Production
        id: deploy
        run: |
          PROD_URL=$(npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$PROD_URL" >> $GITHUB_OUTPUT
          echo "### 🍓 Vercel Production Release Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **Live Flagship:** [https://berryboyzz.vercel.app](https://berryboyzz.vercel.app)" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment URL:** [$PROD_URL]($PROD_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** \`bom1 (Mumbai)\`" >> $GITHUB_STEP_SUMMARY
