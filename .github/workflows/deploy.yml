name: Frontier CI/CD Quality Gate & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: TypeCheck, Tests & Production Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24/26 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict TypeScript & Type Manifest Verification
        run: npm run check

      - name: Execute Vitest Automated Test Matrix
        run: npm test

      - name: Compile Production Build Bundle
        run: npm run build
