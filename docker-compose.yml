services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: berryboyzz-flagship
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - NODE_ENV=production
