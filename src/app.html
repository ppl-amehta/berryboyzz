    <!-- WebMCP (Web Model Context Protocol) Browser Integration -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        var tools = [
          {
            name: 'submit_inbound_lead',
            description: 'Submits an inbound investment, land partnership, or bulk off-take procurement dossier to Berryboyzz and receives a priority lead token and direct WhatsApp Agronomy Desk routing.',
            inputSchema: {
              type: 'object',
              properties: {
                role: { type: 'string', enum: ['investor', 'landowner', 'buyer', 'tour', 'other'], description: 'Category of inbound interest' },
                name: { type: 'string', description: 'Representative full name' },
                phone: { type: 'string', description: 'Direct WhatsApp / mobile phone number' },
                email: { type: 'string', format: 'email', description: 'Official email address' },
                organization: { type: 'string', description: 'Company or fund name' },
                details: { type: 'object', description: 'Role-specific parameters' },
                notes: { type: 'string', description: 'Additional project specifications' }
              },
              required: ['role', 'name', 'phone']
            },
            annotations: { readOnlyHint: false, consequentialHint: true },
            execute: function(params) {
              return fetch('/api/inbound-lead', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(params)
              }).then(function(res) { return res.json(); });
            }
          },
          {
            name: 'get_roi_estimate',
            description: 'Calculates commercial berry polyhouse capital expenditure, MIDH government subsidy, and estimated EBITDA returns for agricultural land in Maharashtra.',
            inputSchema: {
              type: 'object',
              properties: {
                acres: { type: 'number', minimum: 1, maximum: 50, description: 'Land parcel acreage' },
                crop: { type: 'string', enum: ['strawberry', 'raspberry', 'blackberry', 'blueberry'], description: 'Target crop variety' }
              },
              required: ['acres']
            },
            annotations: { readOnlyHint: true, consequentialHint: false },
            execute: function(params) {
              var a = (params && params.acres) || 1;
              var net = 2520000 * a;
              var ebitda = 1536000 * a;
              return Promise.resolve({
                acres: a,
                crop: (params && params.crop) || 'strawberry',
                totalCapexInr: 4200000 * a,
                midhSubsidyInr: 1680000 * a,
                netOutlayInr: net,
                annualEbitdaInr: ebitda,
                paybackMonths: Math.round((net / ebitda) * 12),
                projectedIrrPercent: 44.8,
                currency: 'INR'
              });
            }
          }
        ];
        var toolMap = new Map();
        tools.forEach(function(t) { toolMap.set(t.name, t); });
        var modelContext = {
          registerTool: function(tool) { if (tool && tool.name) toolMap.set(tool.name, tool); },
          getTools: function() { return Promise.resolve(Array.from(toolMap.values())); },
          tools: toolMap
        };
        try {
          if (!('modelContext' in document) || !document.modelContext) {
            Object.defineProperty(document, 'modelContext', { value: modelContext, writable: true, configurable: true });
          }
          if (!('modelContext' in navigator) || !navigator.modelContext) {
            Object.defineProperty(navigator, 'modelContext', { value: modelContext, writable: true, configurable: true });
          }
          window.modelContext = modelContext;
          window.__WEBMCP_TOOLS__ = tools;
          document.__WEBMCP_TOOLS__ = tools;
        } catch (e) {}
      })();
    </script>
